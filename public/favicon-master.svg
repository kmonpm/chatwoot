<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Main background gradient: deep navy to vivid blue -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0F2A6E"/>
      <stop offset="100%" stop-color="#1D6EF5"/>
    </linearGradient>
    <!-- Inner glow on the B -->
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C8DEFF"/>
    </linearGradient>
    <!-- Subtle shine overlay -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="60%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Shine overlay top -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#shine)"/>

  <!-- Chat bubble tail dot — bottom left accent -->
  <circle cx="112" cy="390" r="28" fill="#5B9BFF" opacity="0.55"/>
  <circle cx="72"  cy="430" r="16" fill="#5B9BFF" opacity="0.35"/>

  <!-- Bold "B" lettermark -->
  <!-- Spine -->
  <rect x="148" y="128" width="58" height="256" rx="12" fill="url(#letter)"/>

  <!-- Top bump of B -->
  <path d="
    M 148 128
    L 148 258
    L 272 258
    Q 340 258 340 193
    Q 340 128 272 128
    Z
  " fill="url(#letter)"/>
  <!-- Top bump inner cutout -->
  <path d="
    M 206 168
    L 206 218
    L 268 218
    Q 296 218 296 193
    Q 296 168 268 168
    Z
  " fill="url(#bg)"/>

  <!-- Bottom bump of B -->
  <path d="
    M 148 248
    L 148 384
    L 284 384
    Q 364 384 364 316
    Q 364 248 284 248
    Z
  " fill="url(#letter)"/>
  <!-- Bottom bump inner cutout -->
  <path d="
    M 206 292
    L 206 340
    L 280 340
    Q 312 340 312 316
    Q 312 292 280 292
    Z
  " fill="url(#bg)"/>

  <!-- Small accent dot — top right brand touch -->
  <circle cx="400" cy="128" r="22" fill="#5B9BFF" opacity="0.7"/>
</svg>
